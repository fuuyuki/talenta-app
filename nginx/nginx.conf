events {}

http {
  # Use Docker's embedded DNS and re-resolve service names periodically.
  # Without this, nginx caches the container IP at startup and keeps sending
  # traffic to a dead IP after `docker compose up` recreates a service.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Trust the host reverse proxy so the login rate limit sees real client IPs.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
  limit_req_status 429;

  # Only send `Connection: upgrade` when the client actually asks for it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # Brute-force protection for the only public auth endpoint.
    location = /api/auth/login {
      limit_req zone=login burst=10 nodelay;
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
